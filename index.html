<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickPDF - Developed by Ali Murad</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
            margin-bottom: auto;
        }
        h1 {
            color: #1a73e8;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #5f6368;
            margin-bottom: 25px;
        }
        .upload-box {
            border: 2px dashed #1a73e8;
            padding: 25px;
            border-radius: 8px;
            background-color: #f8f9fa;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #1a73e8;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #1557b0;
        }
        #file-details {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background-color: #e8f0fe;
            display: none;
            text-align: left;
        }
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-top: 1px solid #ccc;
            font-family: sans-serif;
            width: 100%;
            max-width: 600px;
        }
        footer a {
            color: #1a73e8;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>QuickPDF</h1>
        <p class="subtitle">Fast, Secure & Free Online PDF Tool</p>

        <div class="upload-box" onclick="document.getElementById('pdf-input').click()">
            <p style="margin: 0; color: #5f6368;">Click to Select or Open PDF File</p>
            <input type="file" id="pdf-input" accept="application/pdf" style="display: none;">
        </div>

        <div id="file-details"></div>

        <div style="margin-top: 20px;">
            <button class="btn" onclick="processPDF('view')">View Details</button>
            <button class="btn" onclick="processPDF('download')">Process File</button>
        </div>
    </div>

    <!-- Footer Section for AdSense Compliance -->
    <footer>
        <p>&copy; 2026 QuickPDF - Created by Ali Murad</p>
        <p>
            <a href="#privacy" onclick="alert('Privacy Policy: We do not store or share your uploaded files. All PDF processing happens locally in your browser.')">Privacy Policy</a> | 
            <a href="#terms" onclick="alert('Terms of Service: QuickPDF is provided as-is for personal and commercial file management.')">Terms of Service</a> | 
            <a href="mailto:support@quickpdf.com">Contact Us</a>
        </p>
    </footer>

    <script>
        const fileInput = document.getElementById('pdf-input');
        const fileDetails = document.getElementById('file-details');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                fileDetails.style.display = 'block';
                fileDetails.innerHTML = `
                    <strong>Selected File:</strong> ${file.name}<br>
                    <strong>Size:</strong> ${(file.size / (1024 * 1024)).toFixed(2)} MB<br>
                    <strong>Status:</strong> Ready for Processing (100% Local & Private)
                `;
            }
        });

        function processPDF(action) {
            if (!fileInput.files.length) {
                alert("Please select a PDF file first!");
                return;
            }
            const fileName = fileInput.files[0].name;
            if (action === 'view') {
                alert(`QuickPDF: Processing "${fileName}" locally inside your browser.`);
            } else {
                alert(`QuickPDF: "${fileName}" processed successfully!`);
            }
        }
    </script>

</body>
</html>
