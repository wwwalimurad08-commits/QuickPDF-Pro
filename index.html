<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickPDF - All-in-One Free PDF Utility</title>
    <!-- Core PDF Processing Engine -->
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 550px; width: 100%; text-align: center; }
        h1 { color: #1a73e8; margin-bottom: 5px; font-size: 28px; }
        p.subtitle { color: #5f6368; font-size: 14px; margin-bottom: 25px; }
        .upload-area { border: 2px dashed #1a73e8; background: #f8faff; padding: 30px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 20px; }
        .upload-area:hover { background: #eef5ff; }
        .upload-area input { display: none; }
        .file-status { background: #e8f0fe; color: #1967d2; padding: 12px; border-radius: 6px; font-size: 13px; text-align: left; margin-bottom: 20px; display: none; }
        .btn-action { background-color: #1a73e8; color: white; border: none; width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-action:hover { background-color: #1557b0; }
        .btn-action:disabled { background-color: #ccc; cursor: not-allowed; }
        footer { margin-top: auto; padding-top: 20px; font-size: 12px; color: #70757a; text-align: center; }
        footer a { color: #1a73e8; text-decoration: none; margin: 0 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>QuickPDF Pro</h1>
    <p class="subtitle">Convert Images to PDF & Merge PDF Files Instantly</p>

    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <strong>Click to Select Files</strong>
        <p style="margin: 5px 0 0 0; font-size: 12px; color: #888;">Select single/multiple Images (JPG, PNG) or PDFs</p>
        <input type="file" id="fileInput" multiple accept="image/*,application/pdf">
    </div>

    <div id="fileStatus" class="file-status"></div>

    <button id="processBtn" class="btn-action" disabled>Process & Download File</button>
</div>

<footer>
    © 2026 QuickPDF Pro - Developed by Ali Murad<br>
    <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a> | <a href="#">Contact Us</a>
</footer>

<script>
const fileInput = document.getElementById('fileInput');
const fileStatus = document.getElementById('fileStatus');
const processBtn = document.getElementById('processBtn');
let selectedFiles = [];

fileInput.addEventListener('change', (e) => {
    selectedFiles = Array.from(e.target.files);
    if (selectedFiles.length > 0) {
        fileStatus.style.display = 'block';
        fileStatus.innerHTML = `<strong>Selected:</strong> ${selectedFiles.length} file(s)<br>
        <span style="font-size:11px; color:#555;">${selectedFiles.map(f => f.name).join(', ')}</span>`;
        processBtn.disabled = false;
    } else {
        fileStatus.style.display = 'none';
        processBtn.disabled = true;
    }
});

processBtn.addEventListener('click', async () => {
    if (!selectedFiles.length) return;
    
    processBtn.innerText = 'Processing File(s)...';
    processBtn.disabled = true;

    try {
        const mergedPdf = await PDFLib.PDFDocument.create();

        for (const file of selectedFiles) {
            if (file.type.startsWith('image/')) {
                const imageBytes = await file.arrayBuffer();
                let image;
                if (file.type === 'image/jpeg' || file.type === 'image/jpg') {
                    image = await mergedPdf.embedJpg(imageBytes);
                } else if (file.type === 'image/png') {
                    image = await mergedPdf.embedPng(imageBytes);
                }
                
                if (image) {
                    const page = mergedPdf.addPage([image.width, image.height]);
                    page.drawImage(image, { x: 0, y: 0, width: image.width, height: image.height });
                }
            } else if (file.type === 'application/pdf') {
                const pdfBytes = await file.arrayBuffer();
                const srcPdf = await PDFLib.PDFDocument.load(pdfBytes);
                const copiedPages = await mergedPdf.copyPages(srcPdf, srcPdf.getPageIndices());
                copiedPages.forEach((page) => mergedPdf.addPage(page));
            }
        }

        const finalPdfBytes = await mergedPdf.save();
        const blob = new Blob([finalPdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `QuickPDF_Document_${Date.now()}.pdf`;
        link.click();

        processBtn.innerText = 'Process & Download File';
        processBtn.disabled = false;
    } catch (err) {
        alert('File process karte waqt masla aya. Meharbani karke valid image ya PDF select karein.');
        processBtn.innerText = 'Process & Download File';
        processBtn.disabled = false;
    }
});
</script>

</body>
</html
