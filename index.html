<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickPDF Pro - All-in-One PDF Utility Tools</title>
  
  <!-- Google Search Console Verification Tag -->
  <meta name="google-site-verification" content="Your-Search-Console-Meta-Tag-Here" />

  <!-- Google AdSense Code -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6291849846472319" crossorigin="anonymous"></script>

  <!-- Tailwind CSS & PDF Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-200">

  <!-- Navigation Bar -->
  <nav class="bg-white dark:bg-gray-800 shadow-md py-4 px-6 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-indigo-600 dark:text-indigo-400">QuickPDF Pro</h1>
    <button id="themeToggle" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded-lg text-sm font-semibold">
      🌙 Dark Mode
    </button>
  </nav>

  <!-- Main Container -->
  <div class="max-w-4xl mx-auto p-6">
    <header class="text-center my-6">
      <h2 class="text-3xl font-extrabold mb-2">All-in-One Online PDF Tool</h2>
      <p class="text-gray-600 dark:text-gray-400">Merge, Compress, Convert, Protect & Watermark PDFs instantly.</p>
    </header>

    <!-- Top Ad Placement -->
    <div class="my-4 text-center">
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6291849846472319" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <!-- Features Dashboard Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- 1. Merge PDFs -->
      <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow">
        <h3 class="text-xl font-bold mb-2 text-indigo-500">📎 Merge PDFs</h3>
        <input type="file" id="mergeInput" multiple accept="application/pdf" class="block w-full text-sm text-gray-500 mb-4">
        <button onclick="processMerge()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-bold">Merge Files</button>
      </div>

      <!-- 2. Images to PDF -->
      <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow">
        <h3 class="text-xl font-bold mb-2 text-indigo-500">🖼️ Image to PDF</h3>
        <input type="file" id="imgInput" multiple accept="image/*" class="block w-full text-sm text-gray-500 mb-4">
        <button onclick="processImgToPdf()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-bold">Convert to PDF</button>
      </div>

      <!-- 3. Add Watermark -->
      <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow">
        <h3 class="text-xl font-bold mb-2 text-indigo-500">✍️ Add Watermark</h3>
        <input type="file" id="watermarkPdfInput" accept="application/pdf" class="block w-full text-sm text-gray-500 mb-2">
        <input type="text" id="watermarkText" placeholder="Enter Watermark Text" class="w-full p-2 mb-4 rounded border dark:bg-gray-700">
        <button onclick="processWatermark()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-bold">Apply Watermark</button>
      </div>

      <!-- 4. Protect PDF (Password) -->
      <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow">
        <h3 class="text-xl font-bold mb-2 text-indigo-500">🔒 Password Protect</h3>
        <input type="file" id="protectPdfInput" accept="application/pdf" class="block w-full text-sm text-gray-500 mb-2">
        <input type="password" id="pdfPassword" placeholder="Set Password" class="w-full p-2 mb-4 rounded border dark:bg-gray-700">
        <button onclick="processProtect()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-bold">Encrypt PDF</button>
      </div>

    </div>

    <!-- Bottom Ad Placement -->
    <div class="my-8 text-center">
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6291849846472319" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </div>

  <script>
    // Theme Toggle Script
    const toggleBtn = document.getElementById('themeToggle');
    toggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    // Helper: Download Blob
    function downloadBlob(blob, fileName) {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      link.click();
    }

    // Merge Logic
    async function processMerge() {
      const files = document.getElementById('mergeInput').files;
      if (!files.length) return alert('Select files first!');
      const mergedPdf = await PDFLib.PDFDocument.create();
      for (let file of files) {
        const bytes = await file.arrayBuffer();
        const pdf = await PDFLib.PDFDocument.load(bytes);
        const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
        copiedPages.forEach((page) => mergedPdf.addPage(page));
      }
      const pdfBytes = await mergedPdf.save();
      downloadBlob(new Blob([pdfBytes], { type: 'application/pdf' }), 'merged-quickpdf.pdf');
    }

    // Image to PDF Logic
    async function processImgToPdf() {
      const files = document.getElementById('imgInput').files;
      if (!files.length) return alert('Select images first!');
      const pdfDoc = await PDFLib.PDFDocument.create();
      for (let file of files) {
        const bytes = await file.arrayBuffer();
        let image = file.type.includes('png') ? await pdfDoc.embedPng(bytes) : await pdfDoc.embedJpg(bytes);
        const page = pdfDoc.addPage([image.width, image.height]);
        page.drawImage(image, { x: 0, y: 0, width: image.width, height: image.height });
      }
      const pdfBytes = await pdfDoc.save();
      downloadBlob(new Blob([pdfBytes], { type: 'application/pdf' }), 'images-quickpdf.pdf');
    }

    // Watermark Logic
    async function processWatermark() {
      const file = document.getElementById('watermarkPdfInput').files[0];
      const text = document.getElementById('watermarkText').value;
      if (!file || !text) return alert('Provide file and text!');
      const bytes = await file.arrayBuffer();
      const pdfDoc = await PDFLib.PDFDocument.load(bytes);
      const pages = pdfDoc.getPages();
      pages.forEach(page => {
        page.drawText(text, { x: 50, y: page.getHeight() / 2, size: 40, opacity: 0.3 });
      });
      const pdfBytes = await pdfDoc.save();
      downloadBlob(new Blob([pdfBytes], { type: 'application/pdf' }), 'watermarked-quickpdf.pdf');
    }

    // Protect Logic
    async function processProtect() {
      const file = document.getElementById('protectPdfInput').files[0];
      const password = document.getElementById('pdfPassword').value;
      if (!file || !password) return alert('Provide file and password!');
      const bytes = await file.arrayBuffer();
      const pdfDoc = await PDFLib.PDFDocument.load(bytes);
      const pdfBytes = await pdfDoc.save({ userPassword: password, ownerPassword: password });
      downloadBlob(new Blob([pdfBytes], { type: 'application/pdf' }), 'protected-quickpdf.pdf');
    }
  </script>
</body>
</html>
