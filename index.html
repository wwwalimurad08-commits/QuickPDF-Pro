<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickPDF - Fast & Free PDF Tool</title>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #0066cc; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        .upload-box {
            border: 2px dashed #0066cc;
            padding: 25px;
            border-radius: 8px;
            cursor: pointer;
            background: #f8faff;
            margin-bottom: 20px;
        }
        .upload-box input { display: none; }
        .file-info {
            background: #eef5ff;
            padding: 12px;
            border-radius: 6px;
            text-align: left;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .btn-group { display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background-color: #0066cc;
            color: white;
        }
        button:hover { background-color: #0052a3; }
        footer { margin-top: 30px; font-size: 12px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h1>QuickPDF</h1>
    <p>Fast, Secure & Free Online PDF Tool</p>

    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <span>Click to Select or Open File</span>
        <input type="file" id="fileInput" accept="image/*,application/pdf">
    </div>

    <div id="fileDetails" class="file-info" style="display: none;"></div>

    <div class="btn-group">
        <button id="processBtn">Process & Download</button>
    </div>
</div>

<footer>
    © 2026 QuickPDF - Created by Ali Murad
</footer>

<script>
const fileInput = document.getElementById('fileInput');
const fileDetails = document.getElementById('fileDetails');
const processBtn = document.getElementById('processBtn');

fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        fileDetails.style.display = 'block';
        fileDetails.innerHTML = `
            <strong>Selected File:</strong> ${file.name}<br>
            <strong>Size:</strong> ${(file.size / (1024 * 1024)).toFixed(2)} MB<br>
            <strong>Status:</strong> Ready for Processing
        `;
    }
});

processBtn.addEventListener('click', async () => {
    if (!fileInput.files.length) {
        alert('Pehle koi Image ya PDF select karein!');
        return;
    }

    const file = fileInput.files[0];
    processBtn.innerText = 'Processing...';

    try {
        const pdfDoc = await PDFLib.PDFDocument.create();

        if (file.type.startsWith('image/')) {
            const imageBytes = await file.arrayBuffer();
            let image;
            if (file.type === 'image/jpeg' || file.type === 'image/jpg') {
                image = await pdfDoc.embedJpg(imageBytes);
            } else if (file.type === 'image/png') {
                image = await pdfDoc.embedPng(imageBytes);
            }

            if (image) {
                const page = pdfDoc.addPage([image.width, image.height]);
                page.drawImage(image, { x: 0, y: 0, width: image.width, height: image.height });
            }
        }

        const pdfBytes = await pdfDoc.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'QuickPDF_Converted.pdf';
        link.click();
        
        processBtn.innerText = 'Process & Download';
    } catch (err) {
        alert('Error processing file!');
        processBtn.innerText = 'Process & Download';
    }
});
</script>

</body>
</html>
